    function handleLoginAttempt() {
      const email = document.getElementById('inputEmailLogin').value.trim();
      const pass = document.getElementById('inputPassLogin').value;

      if (!email.includes('@') || pass.length < 6) {
        store.security.loginAttempts += 1;
        if (store.security.loginAttempts >= 5) {
          store.security.lockedUntil = Date.now() + 15 * 60 * 1000;
          saveStore();
          alert("Terlalu banyak percobaan gagal! Akun Anda dikunci selama 15 menit.");
        } else {
          saveStore();
          alert(`Email atau sandi salah! Sisa percobaan: ${5 - store.security.loginAttempts}`);
        }
        renderCurrentView();
        return;
      }

      store.security.loginAttempts = 0;
      store.security.lockedUntil = 0;
      saveStore();
      showToast("Berhasil masuk!");
      goHome();
    }

    function commitTalentToCart(talentId) {
      const talent = INITIAL_TALENTS.find(t => t.id === talentId);
      const ev = document.getElementById('detailAcaraInput').value.trim();
      const dt = document.getElementById('detailTanggalInput').value;
      const jm = document.getElementById('detailJamInput').value.trim();
      const lc = document.getElementById('detailLokasiInput').value.trim();

      if (!ev) return alert("Harap isi nama acara.");
      if (!dt || dt < TODAY) return alert("Pilih tanggal acara yang valid.");
      if (!lc) return alert("Harap isi alamat lokasi acara.");

      if (isTalentDateUnavailable(talent.id, dt)) {
        return alert(`Jadwal ${talent.nama} pada ${fmtTanggalIndo(dt)} sudah terisi atau diblokir.`);
      }

      store.cart.push({
        id: 'c_' + Date.now(),
        talentId: talent.id,
        jenisAcara: ev,
        tanggalAcara: dt,
        jamMulai: jm || '19:00 WIB',
        lokasi: lc,
        materi: 'Tausiyah Keagamaan',
        harga: talent.tarif,
        checked: true
      });

      saveStore();
      showToast(`${talent.nama} ditambahkan ke keranjang!`);
      navigate('cart');
    }

    function executeVABooking(bankName) {
      const cfg = BANK_LIST[bankName];
      const checked = store.cart.filter(c => c.checked);
      const total = checked.reduce((a, b) => a + b.harga, 0);
      const va = cfg.prefix + String(Math.floor(1000000000 + Math.random() * 9000000000));

      const createdOrderIds = [];
      checked.forEach(item => {
        const talent = INITIAL_TALENTS.find(t => t.id === item.talentId);
        const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
        const newOrder = {
          id: orderId,
          penyewaNama: store.currentUser.nama,
          talentId: item.talentId,
          talentNama: talent ? talent.nama : 'Talent',
          jenisAcara: item.jenisAcara,
          tanggalAcara: item.tanggalAcara,
          jamMulai: item.jamMulai,
          lokasi: item.lokasi,
          materi: item.materi,
          harga: item.harga,
          status: 'PENDING',
          bankTujuan: bankName,
          vaNumber: va,
          paid: false,
          presencePhoto: null,
          rating: null,
          reviewText: null
        };
        store.orders.unshift(newOrder);
        createdOrderIds.push(orderId);
      });

      store.cart = store.cart.filter(c => !c.checked);
      saveStore();

      const modalHtml = `
        <div class="space-y-4 text-center">
          <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-800 mx-auto flex items-center justify-center text-xl">

          <div class="p-4 bg-emerald-50 border border-emerald-300 rounded-2xl">
            <span class="text-xs text-slate-500">Nomor Virtual Account:</span>
            <div class="text-lg font-mono font-black text-emerald-950 tracking-wider my-1 select-all cursor-pointer" onclick="navigator.clipboard.writeText('${va}'); showToast('Nomor VA tersalin!');" title="Klik untuk salin">
              ${va.replace(/(.{4})/g, '$1 ').trim()}
            </div>
            <span class="text-[10px] text-emerald-800 block underline cursor-pointer" onclick="navigator.clipboard.writeText('${va}'); showToast('Nomor VA tersalin!');">Salin Nomor VA</span>
            <div class="text-xs text-slate-600 mt-2">Total Pembayaran: <b class="text-emerald-950">${fmtRupiah(total)}</b></div>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-4">
            <button onclick="payVASimulation('${createdOrderIds[0]}')" class="py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl text-xs shadow-md">
              Simulasi Bayar Sekarang
            </button>
            <button onclick="closeModal(); navigate('events');" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-xs">
              Bayar Nanti
            </button>
          </div>
        </div>
      `;
      openModal(modalHtml);
    }

    function payVASimulation(orderId) {
      const order = store.orders.find(o => o.id === orderId);
      if (order) {

      saveStore();

    function saveRundownData() {
      const name = document.getElementById('inputRundownName').value.trim();
      const date = document.getElementById('inputRundownDate').value;
      if (!name) return alert("Isi nama acara.");

      const sInputs = document.querySelectorAll('.rd-s');
      const eInputs = document.querySelectorAll('.rd-e');
      const kInputs = document.querySelectorAll('.rd-k');

      const items = [];
      for (let i = 0; i < sInputs.length; i++) {
        items.push({
          jamMulai: sInputs[i].value,
          jamSelesai: eInputs[i].value,
          keterangan: kInputs[i].value || 'Sesi Acara'
        });
      }

    function initChatDOM() {
      const input = document.getElementById('chatKeyboardInput');
      const btn = document.getElementById('sendChatButton');
      const scrollBox = document.getElementById('chatScrollArea');
      const order = store.orders.find(o => o.id === routeParams.orderId) || store.orders[0];

      if (!input || !btn) return;
      if (scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;

      const performSend = () => {
        const text = input.value.trim();
        if (!text) return;

        const isTalent = store.activeRole === 'TALENT';
        if (!store.chats[order.id]) store.chats[order.id] = [];

        const newMsg = {
          sender: isTalent ? 'talent' : 'penyewa',
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        store.chats[order.id].push(newMsg);
        saveStore();

        if (scrollBox) {
          scrollBox.insertAdjacentHTML('beforeend', renderChatBubble(newMsg, isTalent));
          scrollBox.scrollTop = scrollBox.scrollHeight;
        }

        input.value = '';
        input.focus();

        setTimeout(() => {
          const replySender = isTalent ? 'penyewa' : 'talent';
          const replies = isTalent
            ? ["Baik Ustadz, terima kasih konfirmasinya. Sound system dan panggung sudah siap.", "Siap Ustadz, jamaah sudah siap menyambut rawuh panjenengan."]
            : ["Wa'alaikumsalam warahmatullah. Insya Allah kami siap hadir tepat waktu.", "Alhamdulillah, materi aqidah dan akhlak insya Allah kami sampaikan dengan hikmah."];
          const autoText = replies[Math.floor(Math.random() * replies.length)];

          const autoMsg = {
            sender: replySender,
            text: autoText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          store.chats[order.id].push(autoMsg);
          saveStore();

          if (scrollBox && currentRoute === 'chat') {
            scrollBox.insertAdjacentHTML('beforeend', renderChatBubble(autoMsg, isTalent));
            scrollBox.scrollTop = scrollBox.scrollHeight;
          }
        }, 1200);
      };

      btn.onclick = performSend;

      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          performSend();
        }
      };

      setTimeout(() => input.focus(), 80);
    }

                    <span class="text-[10px] font-bold text-emerald-800">REPUBLIK INDONESIA</span>
                    <span class="text-xs font-mono font-bold text-slate-800">3578 •••• •••• 0004</span>
                    <span class="text-[10px] font-bold text-emerald-700">✓ KTP Terbaca Jelas</span>
                  </div>
                </div>

                <label class="w-full py-3 bg-emerald-800 text-white font-bold rounded-xl text-xs flex items-center justify-center space-x-2 cursor-pointer shadow-md">
                  <span>📸 Scan Foto KTP (Enkripsi AES-256)</span>
                  <input type="file" accept="image/*" onchange="handleWizardKTP(event)" class="hidden">
                </label>
              </div>
            ` : ''}

            ${wizardStep === 3 ? `
              <div class="space-y-3 text-left">
                <h3 class="text-base font-bold text-slate-900 text-center">Bidang Keahlian & Tarif</h3>
                <div>
                  <label class="text-xs font-bold text-slate-700">Keahlian Utama</label>
                  <div class="grid grid-cols-2 gap-2 mt-1.5">
                    ${['Ustadz / Da\'i', 'MC Pengajian', 'Qari / Qariah', 'Tim Hadrah'].map(cat => `
                      <label class="flex items-center space-x-2 text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer">
                        <input type="checkbox" checked class="rounded text-emerald-800">
                        <span class="font-semibold text-slate-800">${cat}</span>
                      </label>
                    `).join('')}
                  </div>
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-700">Tarif Infaq per Acara (Rp)</label>
                  <input id="wizTarifInput" type="number" value="${wizardTempData.tarif}" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold">
                </div>
              </div>
            ` : ''}

            ${wizardStep === 4 ? `
              <div class="space-y-3 text-left">
                <h3 class="text-base font-bold text-slate-900 text-center">Rekening Bank Pencairan</h3>
                <div>
                  <label class="text-xs font-bold text-slate-700">Nama Pemilik Rekening (Sesuai KTP)</label>
                  <input id="wizNamaInput" type="text" value="${wizardTempData.namaPemilik}" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold">
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-700">Nama Bank</label>
                  <select id="wizBankSelect" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold">
                    ${Object.keys(BANK_LIST).map(b => `<option ${b.includes('BSI') ? 'selected' : ''}>${b}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-700">Nomor Rekening</label>
                  <input id="wizRekInput" type="text" value="${wizardTempData.noRek}" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono font-bold">
                </div>
              </div>
            ` : ''}
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-slate-100">
            <button onclick="if(wizardStep > 1) { wizardStep--; renderCurrentView(); }" class="text-xs font-bold text-slate-500 hover:text-slate-800 ${wizardStep === 1 ? 'invisible' : ''}">
              ← Sebelumnya
            </button>
            <button onclick="handleWizardNext()" class="w-12 h-12 bg-emerald-800 hover:bg-emerald-900 text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition">
              <span class="text-lg">→</span>
            </button>
          </div>
        </div>
      `;
    }

    function handleWizardAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        wizardTempData.fotoProfil = e.target.result;
        document.getElementById('wizardAvatarPreview').src = e.target.result;
        showToast("Foto profil tersimpan.");
      };
      reader.readAsDataURL(file);
    }

    function handleWizardKTP(event) {
      showToast("Foto KTP berhasil dipindai dengan enkripsi AES-256!");
    }

    function handleWizardNext() {
      if (wizardStep < 4) {
        wizardStep++;
        renderCurrentView();
      } else {
        const no = document.getElementById('wizRekInput').value.trim();
        if (!/^\d{8,16}$/.test(no)) {
          alert("Nomor rekening harus terdiri dari 8 hingga 16 digit angka.");
          return;
        }

        store.talentProfile.isVerified = true;
        saveStore();
        showToast("Verifikasi Talent berhasil diaudit!", "🎉");
        wizardStep = 1;
        navigate('talent-calendar');
      }
    }

    function viewTalentProfile() {
      const p = store.talentProfile;
      return `
        <div class="screen-in pb-8 p-4 space-y-4">
          <div class="bg-white border border-slate-200 rounded-3xl p-5 text-center flex flex-col items-center shadow-2xs">
            <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-emerald-600 mb-2 shadow-inner">
              <img src="${p.foto}" class="w-full h-full object-cover">
            </div>
            <h4 class="text-base font-black text-slate-900">${p.nama}</h4>
            <p class="text-xs text-slate-500">${p.email}</p>
            <span class="mt-2 text-xs font-bold px-3 py-0.5 rounded-full bg-emerald-100 text-emerald-950 border border-emerald-300">
              ✓ Terverifikasi KTP & Rekening
            </span>
          </div>

          <div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-2.5 text-xs shadow-2xs">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
              <span class="text-slate-500">Bank Terdaftar:</span>
              <span class="font-bold text-slate-800">${p.bankName}</span>
            </div>
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
              <span class="text-slate-500">Nomor Rekening:</span>
              <span class="font-mono font-bold text-slate-800">${p.rekening.slice(0, 3)}••••${p.rekening.slice(-3)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-slate-500">Saldo Dompet:</span>
              <span class="font-black text-emerald-950">${fmtRupiah(p.walletBalance)}</span>
            </div>
          </div>

          <button onclick="navigate('talent-wizard')" class="w-full py-3 bg-slate-900 text-white rounded-xl text-xs font-bold shadow-md">
            Ubah Data Verifikasi Talent
          </button>
        </div>
      `;
    }

    let currentRatingStars = 5;

    function openReviewModal(orderId) {
      const order = store.orders.find(o => o.id === orderId);
      if (!order) return;

      const html = `
        <div class="space-y-4 text-center">
          <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-700 mx-auto flex items-center justify-center text-xl">
            ⭐
          </div>
          <h4 class="text-sm font-bold text-slate-900">Beri Penilaian Dakwah</h4>
          <p class="text-xs text-slate-500">${order.talentNama} • ${order.jenisAcara}</p>

          <div class="flex items-center justify-center space-x-2 text-3xl text-amber-400 cursor-pointer select-none">
            <span onclick="setRatingStars(1)" id="star1">★</span>
            <span onclick="setRatingStars(2)" id="star2">★</span>
            <span onclick="setRatingStars(3)" id="star3">★</span>
            <span onclick="setRatingStars(4)" id="star4">★</span>
            <span onclick="setRatingStars(5)" id="star5">★</span>
          </div>

          <textarea id="reviewCommentInput" rows="3" placeholder="Tuliskan ulasan mengenai kesesuaian materi tausiyah dan ketepatan waktu..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none"></textarea>

          <button onclick="commitReview('${order.id}')" class="w-full py-3 bg-emerald-800 text-white font-bold rounded-xl text-xs shadow-md">
            Kirim Penilaian Syiar
          </button>
        </div>
      `;
      openModal(html);
    }

    function setRatingStars(n) {
      currentRatingStars = n;
      for (let i = 1; i <= 5; i++) {
        const star = document.getElementById('star' + i);
        if (star) star.style.color = i <= n ? '#f59e0b' : '#cbd5e1';
      }
    }

    function commitReview(orderId) {
      const text = document.getElementById('reviewCommentInput').value.trim();
      const order = store.orders.find(o => o.id === orderId);
      if (order) {
        order.rating = currentRatingStars;
        order.reviewText = text || 'Alhamdulillah sangat berkah.';
      }
      saveStore();
      closeModal();
      showToast("Terima kasih atas penilaian Anda!");
      renderCurrentView();
    }

    setInterval(() => {
      const d = new Date();
      const clock = document.getElementById('liveClock');
      if (clock) clock.innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    navigate('home');
  </script>
</body>
</html>
